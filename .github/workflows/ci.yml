name: CI

on:
  push:
    branches: [main, staging, v2]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core/crypto, core/db, core/mod_client, services/relay]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lint compares against the staging merge-base
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: Placeholder for embedded frontend
        if: matrix.module == 'core/mod_client'
        run: mkdir -p core/mod_client/frontend/dist && touch core/mod_client/frontend/dist/.keep
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml

  frontend:
    name: Desktop frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/mod_client/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/mod_client/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npx expo lint
      - run: npx tsc --noEmit

  mobile-go:
    name: Mobile Go core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app/go-core
    env:
      GOWORK: 'off' # go-core still shares core/mod_client's module path; joins go.work in v2 step 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile-app/go-core/go.mod
          cache-dependency-path: mobile-app/go-core/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  gomobile:
    name: gomobile bind (Android)
    runs-on: ubuntu-latest
    continue-on-error: true # becomes blocking once the shared core lands (v2 step 3)
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile-app/go-core/go.mod
          cache-dependency-path: mobile-app/go-core/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK and gomobile
        run: |
          sdkmanager --install "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
      - name: Bind
        working-directory: mobile-app/go-core
        run: |
          go get golang.org/x/mobile/bind
          gomobile init
          gomobile bind -target=android -androidapi 21 -ldflags "-checklinkname=0" -o /tmp/libr-core.aar ./bridge

  librserver:
    name: librserver
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/librserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/librserver/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DB node
        run: docker build -f core/db/Dockerfile -t libr-db:ci .
      - name: Relay
        run: docker build -t libr-relay:ci services/relay

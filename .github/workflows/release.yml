name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  relay:
    # The relay and librctl (keys, genesis, headless client/mod) are pure Go.
    name: Relay + librctl (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/relay/go.mod
      - name: Build
        working-directory: services/relay
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -o "$GITHUB_WORKSPACE/libr-relay-${GOOS}-${GOARCH}" .
          cd ../../core/libr && go build -o "$GITHUB_WORKSPACE/librctl-${GOOS}-${GOARCH}" ./cmd/librctl
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            libr-relay-*
            librctl-*

  dbnode:
    # go-sqlite3 needs cgo, so only the native linux/amd64 binary is built here;
    # other platforms use the Docker image (core/db/Dockerfile).
    name: DB node (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/db/go.mod
      - name: Build
        working-directory: core/db
        run: CGO_ENABLED=1 go build -o "$GITHUB_WORKSPACE/libr-dbnode-linux-amd64" .
      - uses: softprops/action-gh-release@v2
        with:
          files: libr-dbnode-linux-amd64

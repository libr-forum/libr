name: Website

# Builds landing-page/ and publishes it on GitHub Pages (custom domain libr.social).
on:
  push:
    branches: [main]
    paths: ['landing-page/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['landing-page/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing-page/package-lock.json
      - run: npm ci
      - run: npm run build
      # Single-page app: Pages serves 404.html for unknown paths (/install, /eula, ...),
      # and the router renders the right page from it.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: landing-page/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

services:
  - type: web
    name: libr-relay
    env: go
    plan: free
    rootDir: .
    buildCommand: cd services/relay && go build -o relay .
    startCommand: ./services/relay/relay
    healthCheckPath: /health
    envVars:
      # Render terminates TLS on 443 and forwards WebSocket traffic to $PORT.
      - key: LIBR_LISTEN
        value: /ip4/0.0.0.0/tcp/10000/ws
      - key: RELAY_ANNOUNCE
        value: /dns4/libr-relay.onrender.com/tcp/443/wss
      - key: LIBP2P_PRIV_KEY
        sync: false

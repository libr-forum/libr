# Run one LIBR v2 DB node. Put community files (*.json moderator sets) in ./communities
# and set LIBR_RELAYS / LIBR_BOOTSTRAP in core/db/.env (see core/db/main.go).
services:
  dbnode:
    build:
      context: .
      dockerfile: core/db/Dockerfile
    env_file:
      - path: core/db/.env
        required: false
    environment:
      LIBR_DATA_DIR: /data
      LIBR_COMMUNITIES: /communities
    volumes:
      - dbnode-data:/data
      - ./communities:/communities:ro
    ports:
      - "4001:4001"
      - "4001:4001/udp"
    restart: unless-stopped

volumes:
  dbnode-data:
